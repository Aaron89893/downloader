<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <span class="logo-icon">⚡</span>
                <span class="brand-name">downloader</span>
            </div>
            <div class="server-status" id="serverStatus" title="Trạng thái Server Backend">
                <span class="status-dot red" id="statusDot"></span>
                <span class="status-text" id="statusText">Checking...</span>
            </div>
        </header>

        <!-- Input Row -->
        <div class="input-section">
            <input type="text" id="urlInput" placeholder="Dán link (YouTube, TikTok, Bilibili)..." autocomplete="off">
        </div>

        <!-- Primary Actions Row -->
        <div class="btn-group">
            <button type="button" id="downloadFastBtn" class="btn-primary btn-dl-fast">
                <span>⚡ Download (1080p)</span>
            </button>
            <button type="button" id="analyzeBtn" class="btn-secondary btn-analyze">
                <span>🔍 Analyze</span>
            </button>
        </div>

        <div class="error-box" id="errorBox" style="display: none;"></div>

        <!-- Video Card (Appears after Analyze) -->
        <div class="video-card" id="videoCard" style="display: none;">
            <div class="thumb-container">
                <img id="videoThumb" src="" alt="Thumbnail">
                <span class="duration-tag" id="videoDuration">00:00</span>
            </div>
            <div class="video-meta">
                <h4 class="video-title" id="videoTitle">Tiêu đề video</h4>
                <p class="video-author" id="videoAuthor">Creator</p>

                <!-- Format Selection Dropdown -->
                <div class="select-wrapper">
                    <label for="qualitySelect">Chất lượng Video & Phụ Đề VI:</label>
                    <select id="qualitySelect" class="quality-dropdown">
                        <option value="1080p">1080p Full HD (Mặc Định)</option>
                        <option value="720p">720p HD (Tải Nhanh)</option>
                        <option value="480p">480p SD</option>
                        <option value="mp3">🎵 Tải File Âm Thanh MP3</option>
                    </select>
                </div>

                <button class="btn-primary btn-dl-custom" id="dlCustomBtn">
                    <span>📥 Tải Video Đã Chọn</span>
                </button>
            </div>
        </div>

        <!-- Download Progress -->
        <div class="progress-box" id="progressBox" style="display: none;">
            <div class="spinner"></div>
            <span id="progressText">Đang xử lý tải video...</span>
        </div>

        <footer class="footer">
            <span>TikTok • YouTube • Bilibili Downloader</span>
            <a href="http://127.0.0.1:5000/history" target="_blank" class="history-link" style="color: #38bdf8; font-weight: 600; text-decoration: none; margin-left: 8px;">📜 Lịch Sử & Log</a>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
