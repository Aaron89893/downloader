<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Tải Video - Downloader Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .history-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-bar h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-clear {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-clear:hover { opacity: 0.9; transform: translateY(-1px); }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .platform-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }
        .status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .status-completed { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-downloading { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .status-failed { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .meta {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .btn-log {
            width: 100%;
            background: rgba(51, 65, 85, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-log:hover { background: rgba(71, 85, 105, 1); }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            width: 90%;
            max-width: 650px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .modal-title { font-size: 16px; font-weight: 700; color: #38bdf8; }
        .log-container {
            background: #020617;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            padding: 12px;
            border-radius: 8px;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="history-container">
        <div class="header-bar">
            <h1>📜 Lịch Sử & Nhật Ký Tải Video</h1>
            <div>
                <a href="/" style="color: #94a3b8; text-decoration: none; margin-right: 15px; font-weight: 600;">← Trang Chủ</a>
                <button class="btn-clear" onclick="clearHistory()">Xóa Lịch Sử</button>
            </div>
        </div>

        <div class="history-grid" id="historyGrid">
            <!-- Dynamic cards -->
        </div>
    </div>

    <!-- Modal Xem Log -->
    <div class="modal" id="logModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Chi Tiết Log Tiến Trình</div>
                <button style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;" onclick="closeModal()">✕</button>
            </div>
            <div class="log-container" id="logText">Đang tải log...</div>
        </div>
    </div>

    <script>
        async function fetchHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const grid = document.getElementById('historyGrid');
                grid.innerHTML = '';

                if (!data.history || data.history.length === 0) {
                    grid.innerHTML = '<div style="color:#94a3b8; grid-column: 1/-1; text-align:center; padding: 40px;">Chưa có lịch sử tải nào.</div>';
                    return;
                }

                data.history.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let statusClass = 'status-downloading';
                    if (item.status === 'COMPLETED') statusClass = 'status-completed';
                    if (item.status === 'FAILED') statusClass = 'status-failed';

                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span class="platform-badge">${item.platform || 'Video'}</span>
                                <span class="status-badge ${statusClass}">${item.status}</span>
                            </div>
                            <div class="title" title="${item.title}">${item.title}</div>
                            <div class="meta">⏰ ${item.timestamp} | Chất lượng: ${item.quality}</div>
                        </div>
                        <button class="btn-log" onclick="viewLog('${item.id}')">🔍 Xem Full Log</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function viewLog(taskId) {
            const modal = document.getElementById('logModal');
            const logText = document.getElementById('logText');
            const modalTitle = document.getElementById('modalTitle');
            
            modalTitle.textContent = `Chi Tiết Log - ${taskId}`;
            logText.textContent = 'Đang đọc log...';
            modal.style.display = 'flex';

            try {
                const res = await fetch(`/api/history/${taskId}`);
                const data = await res.json();
                if (data.item && data.item.logs) {
                    logText.textContent = data.item.logs.join('\n');
                } else {
                    logText.textContent = 'Không có thông tin log.';
                }
            } catch (err) {
                logText.textContent = 'Lỗi khi tải thông tin log: ' + err.message;
            }
        }

        function closeModal() {
            document.getElementById('logModal').style.display = 'none';
        }

        async function clearHistory() {
            if (confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử tải?')) {
                await fetch('/api/history', { method: 'DELETE' });
                fetchHistory();
            }
        }

        fetchHistory();
    </script>
</body>
</html>
